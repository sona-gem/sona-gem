name: Update constellation
on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday
  workflow_dispatch:       # lets you run it by hand too
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - run: python generate_constellation.py ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add constellation.svg
          git diff --staged --quiet || (git commit -m "Update constellation" && git push)
