<svg width="840" height="210" viewBox="0 0 840 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Adaptive Light & Dark Mode Colors */
    .bg-card {
      fill: #faf8f5;
      stroke: #e5e0d8;
    }
    .title {
      font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
      font-size: 40px;
      font-weight: 600;
      fill: #24292f;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      fill: #57606a;
      letter-spacing: 2.2px;
    }
    .wave-line {
      stroke: #7c9a82;
      opacity: 0.45;
    }
    .wave-line-secondary {
      stroke: #c48b78;
      opacity: 0.35;
    }
    .leaf-stroke {
      stroke: #5c7a63;
      opacity: 0.65;
    }
    .dot-accent {
      fill: #c48b78;
    }

    @media (prefers-color-scheme: dark) {
      .bg-card {
        fill: #13171d;
        stroke: #262c36;
      }
      .title {
        fill: #f0f3f6;
      }
      .subtitle {
        fill: #8b949e;
      }
      .wave-line {
        stroke: #8fb396;
        opacity: 0.35;
      }
      .wave-line-secondary {
        stroke: #d49a87;
        opacity: 0.25;
      }
      .leaf-stroke {
        stroke: #8fb396;
        opacity: 0.55;
      }
      .dot-accent {
        fill: #d49a87;
      }
    }

    /* Gentle, slow breathing motion */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(1.5deg); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .botanical-group {
      transform-origin: 730px 145px;
      animation: floatSlow 7s ease-in-out infinite;
    }
    .quantum-node {
      animation: pulseDot 4s ease-in-out infinite;
    }
  </style>

  <!-- Soft Rounded Canvas -->
  <rect x="1" y="1" width="838" height="208" rx="18" class="bg-card" stroke-width="1.2" />

  <!-- Subtle Quantum / Sine Wave Curves on Right -->
  <path d="M 460 155 C 530 95, 610 195, 690 125 C 745 78, 795 110, 838 95" class="wave-line" stroke-width="1.3" fill="none" />
  <path d="M 480 175 C 560 125, 630 205, 715 145 C 765 108, 805 130, 838 120" class="wave-line-secondary" stroke-width="1.1" stroke-dasharray="4 4" fill="none" />

  <!-- Minimalist Botanical Stem & Quantum Nodes -->
  <g class="botanical-group">
    <!-- Main Stem -->
    <path d="M 730 175 Q 722 115 745 55" class="leaf-stroke" stroke-width="1.4" stroke-linecap="round" fill="none" />
    <!-- Left Leaves -->
    <path d="M 726 142 Q 695 135 692 115 Q 715 118 726 142 Z" class="leaf-stroke" stroke-width="1.2" fill="none" />
    <path d="M 730 105 Q 702 95 704 75 Q 724 82 730 105 Z" class="leaf-stroke" stroke-width="1.2" fill="none" />
    <!-- Right Leaves -->
    <path d="M 728 125 Q 758 115 764 96 Q 740 102 728 125 Z" class="leaf-stroke" stroke-width="1.2" fill="none" />
    <path d="M 736 86 Q 764 78 768 60 Q 748 66 736 86 Z" class="leaf-stroke" stroke-width="1.2" fill="none" />
    <!-- Subtle Node Accents -->
    <circle cx="745" cy="55" r="2.8" class="dot-accent quantum-node" />
    <circle cx="690" cy="125" r="2.2" class="dot-accent" />
  </g>

  <!-- Name & Tagline -->
  <text x="52" y="96" class="title">Sona Jomon</text>
  <text x="54" y="132" class="subtitle">CS @ IIIT KOTTAYAM  ·  CV & QUANTUM  ·  FULL-STACK</text>
  
  <!-- Minimal Accent Rule -->
  <line x1="54" y1="154" x2="114" y2="154" stroke="#7c9a82" stroke-width="2" stroke-linecap="round" />
</svg>